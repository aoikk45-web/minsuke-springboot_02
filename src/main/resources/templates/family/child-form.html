<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? '子どもの編集 — MinSuke' : '子どもの追加 — MinSuke'">子ども</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container container-narrow">
    <p class="breadcrumb"><a th:href="@{/my-family}">マイファミリー</a> &gt;
        <span th:text="${isEdit} ? '子どもの編集' : '子どもの追加'">子ども</span></p>
    <h1 th:text="${isEdit} ? '子どもの編集' : '子どもの追加'">子ども</h1>

    <form th:action="${isEdit} ? @{/my-family/children/{id}/edit(id=${childId})} : @{/my-family/children/new}"
          th:object="${childForm}" method="post" class="form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="form-group">
            <label for="name">氏名 *</label>
            <input type="text" id="name" th:field="*{name}" required>
            <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>
        <div class="form-group">
            <label for="nameKana">ふりがな *</label>
            <input type="text" id="nameKana" th:field="*{nameKana}" required>
            <span class="field-error" th:if="${#fields.hasErrors('nameKana')}" th:errors="*{nameKana}"></span>
        </div>
        <div class="form-group">
            <label for="birthDate">生年月日</label>
            <input type="date" id="birthDate" th:field="*{birthDate}">
            <span class="field-error" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></span>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">保存する</button>
            <a th:href="@{/my-family}" class="btn btn-secondary">キャンセル</a>
        </div>
    </form>
</main>
</body>
</html>
