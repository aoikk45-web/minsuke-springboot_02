<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭情報の編集 — MinSuke</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container container-narrow">
    <p class="breadcrumb"><a th:href="@{/my-family}">マイファミリー</a> &gt; 編集</p>
    <h1>家庭情報の編集</h1>

    <form th:action="@{/my-family/edit}" th:object="${householdForm}" method="post" class="form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="form-group">
            <label for="name">家族名 *</label>
            <input type="text" id="name" th:field="*{name}" required>
            <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>
        <div class="form-group">
            <label for="nameKana">ふりがな *</label>
            <input type="text" id="nameKana" th:field="*{nameKana}" required>
            <span class="field-error" th:if="${#fields.hasErrors('nameKana')}" th:errors="*{nameKana}"></span>
        </div>
        <div class="form-group">
            <label for="groupName">班名</label>
            <input type="text" id="groupName" th:field="*{groupName}">
            <span class="field-error" th:if="${#fields.hasErrors('groupName')}" th:errors="*{groupName}"></span>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">保存する</button>
            <a th:href="@{/my-family}" class="btn btn-secondary">キャンセル</a>
        </div>
    </form>
</main>
</body>
</html>
