<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイファミリー — MinSuke</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container container-wide">
    <div class="page-header">
        <h1>マイファミリー</h1>
        <a th:href="@{/my-family/edit}" class="btn btn-secondary">家庭情報を編集</a>
    </div>

    <section class="section">
        <h2 th:text="${household.name}">家族名</h2>
        <p class="card-kana" th:text="${household.nameKana}">ふりがな</p>
        <p th:if="${household.groupName != null}" th:text="'班: ' + ${household.groupName}"></p>
    </section>

    <section class="section">
        <div class="section-header">
            <h2>保護者</h2>
            <a th:href="@{/my-family/parents/new}" class="btn btn-secondary btn-sm">追加</a>
        </div>
        <ul class="member-list member-list-actions" th:if="${!household.parents.isEmpty()}">
            <li th:each="p : ${household.parents}">
                <div class="member-info">
                    <span th:text="${p.name}">名前</span>
                    <span class="member-kana" th:text="'（' + ${p.nameKana} + '）'"></span>
                    <span th:if="${p.phone != null}" th:text="' — ' + ${p.phone}"></span>
                </div>
                <div class="member-actions">
                    <a th:href="@{/my-family/parents/{id}/edit(id=${p.id})}" class="btn-link-inline">編集</a>
                    <form th:action="@{/my-family/parents/{id}/delete(id=${p.id})}" method="post"
                          onsubmit="return confirm('この保護者を削除しますか？');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn-link-inline btn-link-danger">削除</button>
                    </form>
                </div>
            </li>
        </ul>
        <p th:if="${household.parents.isEmpty()}" class="hint">保護者を追加してください。</p>
    </section>

    <section class="section">
        <div class="section-header">
            <h2>子ども</h2>
            <a th:href="@{/my-family/children/new}" class="btn btn-secondary btn-sm">追加</a>
        </div>
        <ul class="member-list member-list-actions" th:if="${!household.children.isEmpty()}">
            <li th:each="c : ${household.children}">
                <div class="member-info">
                    <span th:text="${c.name}">名前</span>
                    <span class="member-kana" th:text="'（' + ${c.nameKana} + '）'"></span>
                    <span th:if="${c.birthDate != null}" th:text="' — 生年月日: ' + ${c.birthDate}"></span>
                </div>
                <div class="member-actions">
                    <a th:href="@{/my-family/children/{id}/edit(id=${c.id})}" class="btn-link-inline">編集</a>
                    <form th:action="@{/my-family/children/{id}/delete(id=${c.id})}" method="post"
                          onsubmit="return confirm('この子どもを削除しますか？');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn-link-inline btn-link-danger">削除</button>
                    </form>
                </div>
            </li>
        </ul>
        <p th:if="${household.children.isEmpty()}" class="hint">子どもを追加してください。</p>
    </section>
</main>
</body>
</html>
