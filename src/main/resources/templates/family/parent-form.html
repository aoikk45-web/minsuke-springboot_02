<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? '保護者の編集 — MinSuke' : '保護者の追加 — MinSuke'">保護者</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container container-narrow">
    <p class="breadcrumb"><a th:href="@{/my-family}">マイファミリー</a> &gt;
        <span th:text="${isEdit} ? '保護者の編集' : '保護者の追加'">保護者</span></p>
    <h1 th:text="${isEdit} ? '保護者の編集' : '保護者の追加'">保護者</h1>

    <form th:action="${isEdit} ? @{/my-family/parents/{id}/edit(id=${parentId})} : @{/my-family/parents/new}"
          th:object="${parentForm}" method="post" class="form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="form-group">
            <label for="name">氏名 *</label>
            <input type="text" id="name" th:field="*{name}" required>
            <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>
        <div class="form-group">
            <label for="nameKana">ふりがな *</label>
            <input type="text" id="nameKana" th:field="*{nameKana}" required>
            <span class="field-error" th:if="${#fields.hasErrors('nameKana')}" th:errors="*{nameKana}"></span>
        </div>
        <div class="form-group">
            <label for="phone">電話番号</label>
            <input type="tel" id="phone" th:field="*{phone}">
            <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">保存する</button>
            <a th:href="@{/my-family}" class="btn btn-secondary">キャンセル</a>
        </div>
    </form>
</main>
</body>
</html>
