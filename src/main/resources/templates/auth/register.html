<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 — MinSuke</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container container-narrow">
    <h1>新規登録</h1>
    <p class="hint">保護者（PARENT）アカウントとして登録します。</p>

    <p th:if="${#fields.hasGlobalErrors()}" class="alert alert-error"
       th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>

    <form th:action="@{/register}" th:object="${registerForm}" method="post" class="form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="form-group">
            <label for="email">メールアドレス *</label>
            <input type="email" id="email" th:field="*{email}" required autocomplete="username">
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="form-group">
            <label for="password">パスワード *</label>
            <input type="password" id="password" th:field="*{password}" required autocomplete="new-password">
            <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>

        <div class="form-group">
            <label for="confirmPassword">パスワード（確認） *</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required autocomplete="new-password">
            <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
        </div>

        <fieldset class="fieldset">
            <legend>家庭情報</legend>
            <div class="form-group">
                <label for="householdName">家族名 *</label>
                <input type="text" id="householdName" th:field="*{householdName}" required>
                <span class="field-error" th:if="${#fields.hasErrors('householdName')}" th:errors="*{householdName}"></span>
            </div>
            <div class="form-group">
                <label for="householdNameKana">ふりがな *</label>
                <input type="text" id="householdNameKana" th:field="*{householdNameKana}" required>
                <span class="field-error" th:if="${#fields.hasErrors('householdNameKana')}" th:errors="*{householdNameKana}"></span>
            </div>
            <div class="form-group">
                <label for="groupName">班名</label>
                <input type="text" id="groupName" th:field="*{groupName}">
                <span class="field-error" th:if="${#fields.hasErrors('groupName')}" th:errors="*{groupName}"></span>
            </div>
        </fieldset>

        <button type="submit" class="btn btn-primary">登録する</button>
    </form>

    <p class="form-footer">
        <a th:href="@{/login}">ログインはこちら</a>
    </p>
</main>
</body>
</html>
