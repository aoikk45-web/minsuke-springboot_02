<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン — MinSuke</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container container-narrow">
    <h1>ログイン</h1>

    <p th:if="${param.logout}" class="alert alert-success">ログアウトしました。</p>
    <p th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></p>
    <p th:if="${param.error}" class="alert alert-error">メールアドレスまたはパスワードが正しくありません。</p>

    <form th:action="@{/login}" method="post" class="form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="form-group">
            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">パスワード</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">ログイン</button>
    </form>

    <p class="form-footer">
        <a th:href="@{/register}">新規登録はこちら</a>
    </p>
</main>
</body>
</html>
