<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>講師一覧 — MinSuke</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container container-wide">
  <div class="page-header">
    <h1>講師一覧</h1>
    <a th:href="@{/instructors/new}" class="btn btn-primary btn-sm" sec:authorize="hasRole('ADMIN')">講師を追加</a>
  </div>

  <p th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></p>

  <div class="card-grid" th:if="${!instructors.isEmpty()}">
    <a th:each="i : ${instructors}" th:href="@{/instructors/{id}(id=${i.id})}" class="card card-link">
      <h2 class="card-title">
        <span th:text="${i.name}">氏名</span>
        <span th:if="${!i.active}" class="badge badge-inactive">無効</span>
      </h2>
      <p class="card-kana" th:text="${i.nameKana}">ふりがな</p>
      <p class="card-meta" th:if="${i.email != null}" th:text="${i.email}"></p>
      <p class="card-meta" th:if="${i.phone != null}" th:text="${i.phone}"></p>
    </a>
  </div>
  <p th:if="${instructors.isEmpty()}" class="hint">登録されている講師はありません。</p>
</main>
</body>
</html>
