<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? '講師の編集 — MinSuke' : '講師の追加 — MinSuke'">講師</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container container-narrow">
  <p class="breadcrumb"><a th:href="@{/instructors}">講師一覧</a> &gt;
    <span th:text="${isEdit} ? '編集' : '追加'">追加</span></p>
  <h1 th:text="${isEdit} ? '講師の編集' : '講師の追加'">講師</h1>

  <form th:action="${isEdit} ? @{/instructors/{id}/edit(id=${instructorId})} : @{/instructors/new}"
        th:object="${instructorForm}" method="post" class="form">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <div class="form-group">
      <label for="name">氏名 *</label>
      <input type="text" id="name" th:field="*{name}" required>
      <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
    </div>
    <div class="form-group">
      <label for="nameKana">ふりがな *</label>
      <input type="text" id="nameKana" th:field="*{nameKana}" required>
      <span class="field-error" th:if="${#fields.hasErrors('nameKana')}" th:errors="*{nameKana}"></span>
    </div>
    <div class="form-group">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" th:field="*{email}">
      <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
    </div>
    <div class="form-group">
      <label for="phone">電話番号</label>
      <input type="tel" id="phone" th:field="*{phone}">
      <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
    </div>
    <div class="form-group">
      <label for="notes">備考</label>
      <textarea id="notes" th:field="*{notes}" rows="4"></textarea>
      <span class="field-error" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></span>
    </div>
    <div class="form-group">
      <label>
        <input type="checkbox" th:field="*{active}"> 有効
      </label>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">保存する</button>
      <a th:href="${isEdit} ? @{/instructors/{id}(id=${instructorId})} : @{/instructors}"
         class="btn btn-secondary">キャンセル</a>
    </div>
  </form>
</main>
</body>
</html>
