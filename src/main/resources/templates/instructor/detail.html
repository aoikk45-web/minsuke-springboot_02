<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${instructor.name} + ' — MinSuke'">講師詳細</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container container-wide">
  <p class="breadcrumb"><a th:href="@{/instructors}">講師一覧</a> &gt; 詳細</p>

  <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
  <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

  <div class="page-header">
    <h1 th:text="${instructor.name}">氏名</h1>
    <span th:if="${!instructor.active}" class="badge badge-inactive">無効</span>
  </div>
  <p class="card-kana" th:text="${instructor.nameKana}">ふりがな</p>

  <section class="section">
    <p th:if="${instructor.email != null}" th:text="'メール: ' + ${instructor.email}"></p>
    <p th:if="${instructor.phone != null}" th:text="'電話: ' + ${instructor.phone}"></p>
    <p th:if="${instructor.notes != null}" th:text="${instructor.notes}"></p>
    <p th:if="${instructor.email == null and instructor.phone == null and instructor.notes == null}"
       class="hint">連絡先・備考は未登録です。</p>
  </section>

  <section class="section" th:if="${instructor.workload != null}">
    <h2>稼働状況</h2>
    <p class="hint">
      担当イベント合計:
      <span th:text="${instructor.workload.totalAssignedCount}">0</span> 件
    </p>

    <h3>今後の担当イベント</h3>
    <table class="data-table" th:if="${!instructor.workload.upcomingEvents.isEmpty()}">
      <thead>
      <tr>
        <th>日付</th>
        <th>時間</th>
        <th>タイトル</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="ev : ${instructor.workload.upcomingEvents}">
        <td th:text="${#temporals.format(ev.eventDate, 'yyyy年M月d日')}">日付</td>
        <td>
          <span th:if="${ev.startTime != null}" th:text="${#temporals.format(ev.startTime, 'HH:mm')}">開始</span>
          <span th:if="${ev.endTime != null}" th:text="' 〜 ' + ${#temporals.format(ev.endTime, 'HH:mm')}">終了</span>
          <span th:if="${ev.startTime == null and ev.endTime == null}">—</span>
        </td>
        <td>
          <a th:href="@{/events/{id}(id=${ev.id})}" th:text="${ev.title}">タイトル</a>
        </td>
      </tr>
      </tbody>
    </table>
    <p th:if="${instructor.workload.upcomingEvents.isEmpty()}" class="hint">今後の担当イベントはありません。</p>

    <h3>月別担当件数</h3>
    <table class="data-table" th:if="${!instructor.workload.monthlyCounts.isEmpty()}">
      <thead>
      <tr>
        <th>月</th>
        <th>件数</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="row : ${instructor.workload.monthlyCounts}">
        <td th:text="${row.yearMonthLabel}">月</td>
        <td th:text="${row.count}">0</td>
      </tr>
      </tbody>
    </table>
    <p th:if="${instructor.workload.monthlyCounts.isEmpty()}" class="hint">担当履歴はありません。</p>
  </section>

  <div class="form-actions" sec:authorize="hasRole('ADMIN')">
    <a th:href="@{/instructors/{id}/edit(id=${instructor.id})}" class="btn btn-secondary">編集</a>
    <form th:if="${instructor.active}" th:action="@{/instructors/{id}/deactivate(id=${instructor.id})}"
          method="post" onsubmit="return confirm('この講師を無効にしますか？');">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit" class="btn btn-secondary">無効にする</button>
    </form>
    <form th:action="@{/instructors/{id}/delete(id=${instructor.id})}" method="post"
          class="delete-form"
          onsubmit="return confirm('この講師を削除しますか？この操作は取り消せません。');">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit" class="btn btn-danger">削除</button>
    </form>
  </div>

  <div class="form-actions">
    <a th:href="@{/instructors}" class="btn btn-secondary">一覧へ戻る</a>
  </div>
</main>
</body>
</html>
