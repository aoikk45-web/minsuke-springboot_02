<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header class="site-header" th:fragment="header">
    <nav class="nav">
        <a class="nav-brand" th:href="@{/calendar}">MinSuke</a>
        <a th:href="@{/calendar}">カレンダー</a>
        <a th:href="@{/families}">家族一覧</a>
        <a th:href="@{/my-family}" sec:authorize="hasRole('PARENT')">マイファミリー</a>
        <a th:href="@{/events/new}" sec:authorize="hasRole('ADMIN')">イベント作成</a>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn-link">ログアウト</button>
        </form>
    </nav>
</header>
</body>
</html>
