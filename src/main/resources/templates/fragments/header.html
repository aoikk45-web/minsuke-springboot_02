<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header class="site-header" th:fragment="header">
    <nav class="nav">
        <a class="nav-brand" th:href="@{/calendar}">MinSuke</a>
        <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true">
        <label for="nav-toggle" class="nav-toggle-btn">
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
            <span class="visually-hidden">メニュー</span>
        </label>
        <div class="nav-links" id="nav-links">
            <a th:href="@{/calendar}">カレンダー</a>
            <a th:href="@{/families}">家族一覧</a>
            <a th:href="@{/instructors}">講師一覧</a>
            <a th:href="@{/schedules}" sec:authorize="hasRole('ADMIN')">スケジュール</a>
            <a th:href="@{/announcements}">
              お知らせ
              <span th:if="${unreadAnnouncementCount > 0}"
                    class="badge badge-unread"
                    th:text="${unreadAnnouncementCount}">0</span>
            </a>
            <a th:href="@{/my-family}" sec:authorize="hasRole('PARENT')">マイファミリー</a>
            <a th:href="@{/announcements/new}" sec:authorize="hasRole('ADMIN')">お知らせ作成</a>
            <a th:href="@{/instructors/new}" sec:authorize="hasRole('ADMIN')">講師追加</a>
            <a th:href="@{/events/new}" sec:authorize="hasRole('ADMIN')">イベント作成</a>
            <form th:action="@{/logout}" method="post" class="logout-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn-link">ログアウト</button>
            </form>
        </div>
    </nav>
</header>
</body>
</html>
