<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${event.title} + ' — MinSuke'">イベント詳細</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container container-wide">
  <p class="breadcrumb"><a th:href="@{/calendar}">カレンダー</a> &gt; イベント詳細</p>

  <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
  <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

  <div class="page-header">
    <h1 th:text="${event.title}">イベント</h1>
    <span th:if="${event.full}" class="badge badge-full">満員</span>
  </div>

  <p class="event-meta">
    <span th:text="${#temporals.format(event.eventDate, 'yyyy年M月d日')}">日付</span>
    <span th:if="${event.startTime != null}"
          th:text="' ' + ${#temporals.format(event.startTime, 'HH:mm')}">開始</span>
    <span th:if="${event.endTime != null}"
          th:text="' 〜 ' + ${#temporals.format(event.endTime, 'HH:mm')}">終了</span>
  </p>

  <p th:text="${event.description}">説明</p>

  <p class="hint">
    担当講師:
    <a th:if="${event.instructorId != null}"
       th:href="@{/instructors/{id}(id=${event.instructorId})}"
       th:text="${event.instructorName}">講師</a>
    <span th:if="${event.instructorId == null}">未設定</span>
  </p>

  <p class="hint">
    参加者:
    <span th:text="${event.registeredCount}">0</span>
    <span th:if="${!event.unlimitedCapacity}" th:text="' / ' + ${event.capacity}">/ 定員</span>
    <span th:if="${event.unlimitedCapacity}">（定員なし）</span>
  </p>

  <section class="section" sec:authorize="hasRole('PARENT')" th:if="${!event.participantOptions.isEmpty()}">
    <h2>参加登録（マイファミリー）</h2>
    <ul class="member-list member-list-actions">
      <li th:each="option : ${event.participantOptions}">
        <div class="member-info">
          <span th:text="${option.name}">名前</span>
          <span class="member-kana" th:text="${option.type.name() == 'PARENT'} ? '（保護者）' : '（子ども）'"></span>
          <span th:if="${option.registered}" class="badge badge-registered">参加中</span>
        </div>
        <div class="member-actions">
          <form th:if="${option.registered}"
                th:action="@{/events/{id}/attend(id=${event.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="action" value="cancel">
            <input type="hidden" name="participantType" th:value="${option.type}">
            <input type="hidden" name="parentId" th:if="${option.parentId != null}" th:value="${option.parentId}">
            <input type="hidden" name="childId" th:if="${option.childId != null}" th:value="${option.childId}">
            <button type="submit" class="btn-link-inline">キャンセル</button>
          </form>
          <form th:if="${option.canRegister}"
                th:action="@{/events/{id}/attend(id=${event.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="action" value="register">
            <input type="hidden" name="participantType" th:value="${option.type}">
            <input type="hidden" name="parentId" th:if="${option.parentId != null}" th:value="${option.parentId}">
            <input type="hidden" name="childId" th:if="${option.childId != null}" th:value="${option.childId}">
            <button type="submit" class="btn btn-primary btn-sm">参加する</button>
          </form>
          <span th:if="${!option.registered and !option.canRegister and event.full}" class="hint">満員</span>
        </div>
      </li>
    </ul>
  </section>

  <section class="section" th:if="${!event.registeredParticipants.isEmpty()}">
    <h2>参加者一覧</h2>
    <table class="data-table">
      <thead>
      <tr>
        <th>名前</th>
        <th>区分</th>
        <th>家庭</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="p : ${event.registeredParticipants}">
        <td th:text="${p.name}">名前</td>
        <td th:text="${p.typeLabel}">区分</td>
        <td th:text="${p.householdName}">家庭</td>
      </tr>
      </tbody>
    </table>
  </section>
  <p th:if="${event.registeredParticipants.isEmpty()}" class="hint">まだ参加者はいません。</p>

  <div class="form-actions">
    <a sec:authorize="hasRole('ADMIN')"
       th:href="@{/events/{id}/edit(id=${event.id})}"
       class="btn btn-secondary">編集</a>
    <a th:href="@{/calendar}" class="btn btn-secondary">カレンダーへ戻る</a>
  </div>
</main>
</body>
</html>
