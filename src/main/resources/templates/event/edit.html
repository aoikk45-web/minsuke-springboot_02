<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イベント編集 — MinSuke</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container container-narrow">
  <p class="breadcrumb">
    <a th:href="@{/calendar}">カレンダー</a> &gt;
    <a th:href="@{/events/{id}(id=${eventId})}">イベント詳細</a> &gt; 編集
  </p>
  <h1>イベント編集</h1>

  <form th:action="@{/events/{id}/edit(id=${eventId})}" th:object="${eventForm}" method="post" class="form">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <div class="form-group">
      <label for="title">タイトル *</label>
      <input type="text" id="title" th:field="*{title}" required>
      <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
    </div>

    <div class="form-group">
      <label for="description">説明 *</label>
      <textarea id="description" th:field="*{description}" rows="5" required></textarea>
      <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
    </div>

    <div class="form-group">
      <label for="eventDate">開催日 *</label>
      <input type="date" id="eventDate" th:field="*{eventDate}" required>
      <span class="field-error" th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}"></span>
    </div>

    <div class="form-group">
      <label for="startTime">開始時刻</label>
      <input type="time" id="startTime" th:field="*{startTime}">
      <span class="field-error" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}"></span>
    </div>

    <div class="form-group">
      <label for="endTime">終了時刻</label>
      <input type="time" id="endTime" th:field="*{endTime}">
      <span class="field-error" th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}"></span>
    </div>

    <div class="form-group">
      <label for="capacity">定員（空欄で無制限）</label>
      <input type="number" id="capacity" th:field="*{capacity}" min="1">
      <span class="field-error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></span>
    </div>

    <div class="form-group">
      <label for="participationUnit">参加登録単位 *</label>
      <select id="participationUnit" th:field="*{participationUnit}" required>
        <option value="">選択してください</option>
        <option th:each="u : ${participationUnits}" th:value="${u}" th:text="${u.label()}">単位</option>
      </select>
      <span class="field-error" th:if="${#fields.hasErrors('participationUnit')}" th:errors="*{participationUnit}"></span>
    </div>

    <div class="form-group">
      <label for="instructorId">担当講師（任意）</label>
      <select id="instructorId" th:field="*{instructorId}">
        <option value="">未設定</option>
        <option th:each="inst : ${instructors}"
                th:value="${inst.id}"
                th:text="${inst.name}">講師</option>
      </select>
      <span class="field-error" th:if="${#fields.hasErrors('instructorId')}" th:errors="*{instructorId}"></span>
    </div>

    <span class="field-error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">保存する</button>
      <a th:href="@{/events/{id}(id=${eventId})}" class="btn btn-secondary">キャンセル</a>
    </div>
  </form>
</main>
</body>
</html>
