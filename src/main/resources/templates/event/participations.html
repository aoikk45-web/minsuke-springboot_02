<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>参加履歴 — MinSuke</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container container-wide">
  <p class="breadcrumb"><a th:href="@{/calendar}">カレンダー</a> &gt; 参加履歴</p>

  <div class="page-header">
    <h1>参加履歴</h1>
  </div>

  <p class="hint">マイファミリーが参加中のイベントです。キャンセル済みは含まれません。</p>

  <table class="data-table" th:if="${!participations.isEmpty()}">
    <thead>
    <tr>
      <th>日付</th>
      <th>時間</th>
      <th>イベント</th>
      <th>参加者</th>
      <th>区分</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="row : ${participations}">
      <td th:text="${#temporals.format(row.eventDate, 'yyyy年M月d日')}">日付</td>
      <td>
        <span th:if="${row.startTime != null}"
              th:text="${#temporals.format(row.startTime, 'HH:mm')}">開始</span>
        <span th:if="${row.endTime != null}"
              th:text="' 〜 ' + ${#temporals.format(row.endTime, 'HH:mm')}">終了</span>
        <span th:if="${row.startTime == null and row.endTime == null}">—</span>
      </td>
      <td>
        <a th:href="@{/events/{id}(id=${row.eventId})}" th:text="${row.eventTitle}">イベント</a>
      </td>
      <td th:text="${row.participantName}">名前</td>
      <td th:text="${row.participantTypeLabel}">区分</td>
    </tr>
    </tbody>
  </table>
  <p th:if="${participations.isEmpty()}" class="hint">参加中のイベントはまだありません。</p>
</main>
</body>
</html>
