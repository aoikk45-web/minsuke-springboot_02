<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'スケジュールの編集 — MinSuke' : 'スケジュールの作成 — MinSuke'">スケジュール</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container container-narrow">
  <p class="breadcrumb"><a th:href="@{/schedules}">スケジュール</a> &gt;
    <span th:text="${isEdit} ? '編集' : '作成'">作成</span></p>
  <h1 th:text="${isEdit} ? 'スケジュールの編集' : 'スケジュールの作成'">スケジュール</h1>

  <form th:action="${isEdit} ? @{/schedules/{id}/edit(id=${scheduleId})} : @{/schedules/new}"
        th:object="${scheduleForm}" method="post" class="form" id="scheduleForm">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <div class="form-group">
      <label for="title">タイトル *</label>
      <input type="text" id="title" th:field="*{title}" required>
      <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
    </div>

    <div class="form-group">
      <label for="description">説明 *</label>
      <textarea id="description" th:field="*{description}" rows="5" required></textarea>
      <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
    </div>

    <div class="form-group">
      <label for="scheduleType">種別 *</label>
      <select id="scheduleType" th:field="*{scheduleType}" required>
        <option value="">選択してください</option>
        <option th:each="t : ${scheduleTypes}" th:value="${t}" th:text="${t.name() == 'ONE_OFF'} ? '単発' : '毎週'">種別</option>
      </select>
      <span class="field-error" th:if="${#fields.hasErrors('scheduleType')}" th:errors="*{scheduleType}"></span>
    </div>

    <div class="form-group schedule-one-off">
      <label for="oneOffDate">開催日（単発） *</label>
      <input type="date" id="oneOffDate" th:field="*{oneOffDate}">
      <span class="field-error" th:if="${#fields.hasErrors('oneOffDate')}" th:errors="*{oneOffDate}"></span>
    </div>

    <div class="form-group schedule-weekly">
      <span class="field-label">曜日（毎週） *</span>
      <div class="checkbox-list">
        <label><input type="checkbox" th:field="*{daysOfWeek}" value="1"> 月</label>
        <label><input type="checkbox" th:field="*{daysOfWeek}" value="2"> 火</label>
        <label><input type="checkbox" th:field="*{daysOfWeek}" value="3"> 水</label>
        <label><input type="checkbox" th:field="*{daysOfWeek}" value="4"> 木</label>
        <label><input type="checkbox" th:field="*{daysOfWeek}" value="5"> 金</label>
        <label><input type="checkbox" th:field="*{daysOfWeek}" value="6"> 土</label>
        <label><input type="checkbox" th:field="*{daysOfWeek}" value="7"> 日</label>
      </div>
    </div>

    <div class="form-group schedule-weekly">
      <label for="validFrom">適用開始日（毎週・任意）</label>
      <input type="date" id="validFrom" th:field="*{validFrom}">
    </div>

    <div class="form-group schedule-weekly">
      <label for="validUntil">適用終了日（毎週・任意）</label>
      <input type="date" id="validUntil" th:field="*{validUntil}">
    </div>

    <div class="form-group">
      <label for="startTime">開始時刻</label>
      <input type="time" id="startTime" th:field="*{startTime}">
    </div>

    <div class="form-group">
      <label for="endTime">終了時刻</label>
      <input type="time" id="endTime" th:field="*{endTime}">
    </div>

    <div class="form-group">
      <label for="capacity">定員（空欄で無制限）</label>
      <input type="number" id="capacity" th:field="*{capacity}" min="1">
      <span class="field-error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></span>
    </div>

    <div class="form-group">
      <label for="participationUnit">参加登録単位 *</label>
      <select id="participationUnit" th:field="*{participationUnit}" required>
        <option value="">選択してください</option>
        <option th:each="u : ${participationUnits}" th:value="${u}" th:text="${u.label()}">単位</option>
      </select>
      <span class="field-error" th:if="${#fields.hasErrors('participationUnit')}" th:errors="*{participationUnit}"></span>
    </div>

    <div class="form-group">
      <label for="instructorId">担当講師（任意）</label>
      <select id="instructorId" th:field="*{instructorId}">
        <option value="">未設定</option>
        <option th:each="inst : ${instructors}"
                th:value="${inst.id}"
                th:text="${inst.name}">講師</option>
      </select>
    </div>

    <div class="form-group">
      <label>
        <input type="checkbox" th:field="*{active}"> 有効
      </label>
    </div>

    <span class="field-error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">保存する</button>
      <a th:href="${isEdit} ? @{/schedules/{id}(id=${scheduleId})} : @{/schedules}"
         class="btn btn-secondary">キャンセル</a>
    </div>
  </form>
</main>
<script>
(function () {
  var typeSelect = document.getElementById('scheduleType');
  var oneOffFields = document.querySelectorAll('.schedule-one-off');
  var weeklyFields = document.querySelectorAll('.schedule-weekly');

  function toggleFields() {
    var type = typeSelect.value;
    oneOffFields.forEach(function (el) {
      el.style.display = type === 'ONE_OFF' ? '' : 'none';
    });
    weeklyFields.forEach(function (el) {
      el.style.display = type === 'WEEKLY' ? '' : 'none';
    });
  }

  typeSelect.addEventListener('change', toggleFields);
  toggleFields();
})();
</script>
</body>
</html>
