<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${schedule.title} + ' — MinSuke'">スケジュール詳細</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container container-wide">
  <p class="breadcrumb"><a th:href="@{/schedules}">スケジュール</a> &gt; 詳細</p>

  <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
  <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

  <div class="page-header">
    <h1 th:text="${schedule.title}">タイトル</h1>
    <span th:if="${!schedule.active}" class="badge badge-inactive">無効</span>
  </div>

  <p th:text="${schedule.description}">説明</p>

  <section class="section">
    <p th:text="'種別: ' + ${schedule.scheduleTypeLabel}">種別</p>
    <p th:if="${schedule.scheduleType.name() == 'ONE_OFF' and schedule.oneOffDate != null}"
       th:text="'開催日: ' + ${#temporals.format(schedule.oneOffDate, 'yyyy年M月d日')}">開催日</p>
    <p th:if="${schedule.scheduleType.name() == 'WEEKLY' and schedule.daysOfWeekLabel != null}"
       th:text="'曜日: ' + ${schedule.daysOfWeekLabel}">曜日</p>
    <p th:if="${schedule.scheduleType.name() == 'WEEKLY' and schedule.validFrom != null}"
       th:text="'適用開始: ' + ${#temporals.format(schedule.validFrom, 'yyyy年M月d日')}">適用開始</p>
    <p th:if="${schedule.scheduleType.name() == 'WEEKLY' and schedule.validUntil != null}"
       th:text="'適用終了: ' + ${#temporals.format(schedule.validUntil, 'yyyy年M月d日')}">適用終了</p>
    <p th:if="${schedule.startTime != null or schedule.endTime != null}">
      時間:
      <span th:if="${schedule.startTime != null}"
            th:text="${#temporals.format(schedule.startTime, 'HH:mm')}">開始</span>
      <span th:if="${schedule.endTime != null}"
            th:text="' 〜 ' + ${#temporals.format(schedule.endTime, 'HH:mm')}">終了</span>
    </p>
    <p th:if="${schedule.capacity != null}" th:text="'定員: ' + ${schedule.capacity}">定員</p>
    <p th:if="${schedule.capacity == null}" class="hint">定員: なし</p>
    <p th:text="'参加登録単位: ' + (${schedule.participationUnitLabel != null} ? ${schedule.participationUnitLabel} : '制限なし（保護者・子ども）')">単位</p>
    <p class="hint">
      担当講師:
      <a th:if="${schedule.instructorId != null}"
         th:href="@{/instructors/{id}(id=${schedule.instructorId})}"
         th:text="${schedule.instructorName}">講師</a>
      <span th:if="${schedule.instructorId == null}">未設定</span>
    </p>
  </section>

  <section class="section">
    <h2>イベント生成</h2>
    <p class="hint">今後 <span th:text="${generateWeeks}">4</span> 週分のイベントを生成します（同一日付はスキップ）。</p>
    <form th:action="@{/schedules/{id}/generate(id=${schedule.id})}" method="post" class="inline-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <input type="hidden" name="weeks" th:value="${generateWeeks}">
      <button type="submit" class="btn btn-primary" th:disabled="${!schedule.active}">イベントを生成</button>
    </form>
  </section>

  <section class="section">
    <h2>生成済みイベント</h2>
    <table class="data-table" th:if="${!schedule.generatedEvents.isEmpty()}">
      <thead>
      <tr>
        <th>日付</th>
        <th>時間</th>
        <th>タイトル</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="ev : ${schedule.generatedEvents}">
        <td>
          <a th:href="@{/events/{id}(id=${ev.id})}"
             th:text="${#temporals.format(ev.eventDate, 'yyyy年M月d日')}">日付</a>
        </td>
        <td th:text="${ev.startTime != null} ? ${#temporals.format(ev.startTime, 'HH:mm')} : '—'">時間</td>
        <td th:text="${ev.title}">タイトル</td>
      </tr>
      </tbody>
    </table>
    <p th:if="${schedule.generatedEvents.isEmpty()}" class="hint">まだイベントは生成されていません。</p>
  </section>

  <div class="form-actions">
    <a th:href="@{/schedules/{id}/participations(id=${schedule.id})}" class="btn btn-primary">参加状況</a>
    <a th:href="@{/schedules/{id}/edit(id=${schedule.id})}" class="btn btn-secondary">編集</a>
    <form th:action="@{/schedules/{id}/delete(id=${schedule.id})}" method="post"
          onsubmit="return confirm('このスケジュールを削除しますか？');">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit" class="btn btn-danger">削除</button>
    </form>
  </div>
</main>
</body>
</html>
