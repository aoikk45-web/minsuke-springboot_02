<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${view.scheduleTitle} + ' — 参加状況'">参加状況</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container container-wide">
  <p class="breadcrumb">
    <a th:href="@{/schedules}">スケジュール</a> &gt;
    <a th:href="@{/schedules/{id}(id=${view.scheduleId})}" th:text="${view.scheduleTitle}">詳細</a> &gt;
    参加状況
  </p>

  <div class="page-header">
    <h1>家庭参加率</h1>
  </div>

  <p class="hint">
    その回に家庭の登録が1件以上あれば「参加1回」です。対象回は生成済みイベント
    <span th:text="${view.totalEvents}">0</span> 件です（満員の回も含みます）。
  </p>

  <div class="page-header">
    <a class="btn btn-secondary btn-sm"
       th:href="@{/schedules/{id}/participations(id=${view.scheduleId})}">全期間</a>
    <a class="btn btn-secondary btn-sm"
       th:href="@{/schedules/{id}/participations(id=${view.scheduleId}, year=${currentMonth.year}, month=${currentMonth.monthValue})}">今月のみ</a>
    <span th:if="${view.filterMonth != null}"
          th:text="'表示: ' + ${#temporals.format(view.filterMonth.atDay(1), 'yyyy年M月')}">表示</span>
    <span th:if="${view.filterMonth == null}">表示: 全期間</span>
  </div>

  <table class="data-table" th:if="${!view.households.isEmpty()}">
    <thead>
    <tr>
      <th>家庭</th>
      <th>参加</th>
      <th>対象</th>
      <th>参加率</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="row : ${view.households}">
      <td th:text="${row.householdName}">家庭</td>
      <td th:text="${row.attendedCount}">0</td>
      <td th:text="${row.totalEvents}">0</td>
      <td th:text="${row.ratePercent} + '%'">0%</td>
    </tr>
    </tbody>
  </table>
  <p th:if="${view.households.isEmpty()}" class="hint">家庭がまだありません。</p>

  <div class="form-actions">
    <a th:href="@{/schedules/{id}(id=${view.scheduleId})}" class="btn btn-secondary">スケジュール詳細へ</a>
    <a th:href="@{/admin/participations}" class="btn btn-secondary">月次充足へ</a>
  </div>
</main>
</body>
</html>
