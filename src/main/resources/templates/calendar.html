<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダー — MinSuke</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container container-wide">
  <div class="page-header">
    <h1 th:text="${calendar.monthLabel}">2026年8月</h1>
    <div class="calendar-nav">
      <a th:href="@{/calendar(year=${calendar.previousYear}, month=${calendar.previousMonth})}"
         class="btn btn-secondary btn-sm">前月</a>
      <a th:href="@{/calendar}" class="btn btn-secondary btn-sm">今月</a>
      <a th:href="@{/calendar(year=${calendar.nextYear}, month=${calendar.nextMonth})}"
         class="btn btn-secondary btn-sm">翌月</a>
    </div>
  </div>

  <table class="calendar-grid">
    <thead>
    <tr>
      <th>日</th>
      <th>月</th>
      <th>火</th>
      <th>水</th>
      <th>木</th>
      <th>金</th>
      <th>土</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="week : ${calendar.weeks}">
      <td th:each="day : ${week.days}"
          th:class="${'calendar-day' + (!day.currentMonth ? ' calendar-day-other' : '') + (day.today ? ' calendar-day-today' : '')}">
        <div class="calendar-day-number" th:text="${day.dayOfMonth}">1</div>
        <ul class="calendar-events">
          <li th:each="ev : ${day.events}">
            <a th:href="@{/events/{id}(id=${ev.id})}" class="calendar-event-link"
               th:classappend="${ev.full} ? ' calendar-event-full' : ''">
              <span th:text="${ev.title}">イベント</span>
              <span th:if="${ev.full}" class="calendar-full-label">満</span>
            </a>
          </li>
        </ul>
      </td>
    </tr>
    </tbody>
  </table>
</main>
</body>
</html>
