<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'お知らせの編集 — MinSuke' : 'お知らせの作成 — MinSuke'">お知らせ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container container-narrow">
  <p class="breadcrumb"><a th:href="@{/announcements}">お知らせ</a> &gt;
    <span th:text="${isEdit} ? '編集' : '作成'">作成</span></p>
  <h1 th:text="${isEdit} ? 'お知らせの編集' : 'お知らせの作成'">お知らせ</h1>

  <form th:action="${isEdit} ? @{/announcements/{id}/edit(id=${announcementId})} : @{/announcements/new}"
        th:object="${announcementForm}" method="post" class="form">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <div class="form-group">
      <label for="title">タイトル *</label>
      <input type="text" id="title" th:field="*{title}" required>
      <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
    </div>

    <div class="form-group">
      <label for="body">本文 *</label>
      <textarea id="body" th:field="*{body}" rows="10" required></textarea>
      <span class="field-error" th:if="${#fields.hasErrors('body')}" th:errors="*{body}"></span>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" th:text="${isEdit} ? '保存する' : '公開する'">公開する</button>
      <a th:href="${isEdit} ? @{/announcements/{id}(id=${announcementId})} : @{/announcements}"
         class="btn btn-secondary">キャンセル</a>
    </div>
  </form>
</main>
</body>
</html>
