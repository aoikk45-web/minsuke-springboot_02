<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${announcement.title} + ' — MinSuke'">お知らせ詳細</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container container-narrow">
  <p class="breadcrumb"><a th:href="@{/announcements}">お知らせ</a> &gt; 詳細</p>

  <div class="page-header">
    <h1 th:text="${announcement.title}">タイトル</h1>
  </div>
  <p class="hint"
     th:text="${#temporals.format(announcement.publishedAt, 'yyyy年M月d日 HH:mm')}">公開日時</p>

  <section class="section">
    <p class="announcement-body" th:text="${announcement.body}">本文</p>
  </section>

  <div class="form-actions" sec:authorize="hasRole('ADMIN')">
    <a th:href="@{/announcements/{id}/edit(id=${announcement.id})}" class="btn btn-secondary">編集</a>
    <form th:action="@{/announcements/{id}/delete(id=${announcement.id})}" method="post"
          class="delete-form"
          onsubmit="return confirm('このお知らせを削除しますか？');">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit" class="btn btn-danger">削除</button>
    </form>
  </div>

  <div class="form-actions">
    <a th:href="@{/announcements}" class="btn btn-secondary">一覧へ戻る</a>
  </div>
</main>
</body>
</html>
