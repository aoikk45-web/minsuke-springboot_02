spring:
  application:
    name: minsuke
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Tokyo
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false

server:
  port: 8080
  servlet:
    session:
      timeout: 30m

logging:
  level:
    root: INFO
    com.minsuke: DEBUG
